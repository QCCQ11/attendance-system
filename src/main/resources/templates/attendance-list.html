<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>考勤记录</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <style>
        body {
            background-image: url("/bg-library.jpg");
            background-size: cover;
            background-attachment: fixed;
            background-color: rgba(44, 66, 87, 0.45);
            background-blend-mode: multiply;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .card {
            background: #F8F3E6;
            border-radius: 24px;
            overflow: hidden;
        }
        .card-header {
            background: #2C4257;
            color: #F8F3E6;
            padding: 1rem 1.5rem;
        }
        .filter-bar {
            background: #EAE3D4;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .badge-normal { background: #28a745; color: white; padding: 4px 12px; border-radius: 20px; }
        .badge-late { background: #ffc107; color: #333; padding: 4px 12px; border-radius: 20px; }
        .badge-early { background: #17a2b8; color: white; padding: 4px 12px; border-radius: 20px; }
        .badge-absent { background: #dc3545; color: white; padding: 4px 12px; border-radius: 20px; }

        .btn-primary {
            background-color: #2C4257;
            border-color: #2C4257;
        }
        .btn-primary:hover {
            background-color: #3A556F;
            border-color: #3A556F;
        }

        .page-item.active .page-link {
            background-color: #2C4257;
            border-color: #2C4257;
            color: #fff;
        }
        .page-link {
            color: #2C4257;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">📋 考勤记录</div>
        <div class="card-body p-4">
            <form method="get" action="/attendance/list" class="filter-bar row g-3">
                <div class="col-md-3">
                    <label>开始日期</label>
                    <input type="date" name="startDate" class="form-control" th:value="${startDate}">
                </div>
                <div class="col-md-3">
                    <label>结束日期</label>
                    <input type="date" name="endDate" class="form-control" th:value="${endDate}">
                </div>
                <div class="col-md-3">
                    <label>状态</label>
                    <select name="status" class="form-select">
                        <option value="">全部</option>
                        <option value="NORMAL" th:selected="${status == 'NORMAL'}">正常</option>
                        <option value="LATE" th:selected="${status == 'LATE'}">迟到</option>
                        <option value="EARLY" th:selected="${status == 'EARLY'}">早退</option>
                        <option value="ABSENT" th:selected="${status == 'ABSENT'}">缺勤</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">🔍 查询</button>
                </div>
            </form>

            <table class="table table-striped">
                <thead>
                <tr><th>日期</th><th>课程</th><th>打卡时间</th><th>状态</th><th>备注</th></tr>
                </thead>
                <tbody>
                <tr th:each="record : ${records}">
                    <td th:text="${#temporals.format(record.attendanceDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${record.courseName}"></td>
                    <td th:text="${#temporals.format(record.recordTime, 'HH:mm:ss')}"></td>
                    <td>
                        <span th:class="${record.status == 'NORMAL'} ? 'badge-normal' : (${record.status == 'LATE'} ? 'badge-late' : (${record.status == 'EARLY'} ? 'badge-early' : 'badge-absent'))"
                              th:text="${record.status == 'NORMAL'} ? '正常' : (${record.status == 'LATE'} ? '迟到' : (${record.status == 'EARLY'} ? '早退' : '缺勤'))">
                        </span>
                    </td>
                    <td th:text="${record.remark}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(records)}">
                    <td colspan="5" class="text-center">暂无考勤记录</td>
                </tr>
                </tbody>
            </table>

            <nav th:if="${totalPages > 0}">
                <ul class="pagination">
                    <li th:class="${currentPage == 1} ? 'page-item disabled' : 'page-item'">
                        <a class="page-link" th:href="@{/attendance/list(page=${currentPage-1}, startDate=${startDate}, endDate=${endDate}, status=${status})}">上一页</a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(1, totalPages)}" th:class="${i == currentPage} ? 'page-item active' : 'page-item'">
                        <a class="page-link" th:href="@{/attendance/list(page=${i}, startDate=${startDate}, endDate=${endDate}, status=${status})}" th:text="${i}"></a>
                    </li>
                    <li th:class="${currentPage == totalPages} ? 'page-item disabled' : 'page-item'">
                        <a class="page-link" th:href="@{/attendance/list(page=${currentPage+1}, startDate=${startDate}, endDate=${endDate}, status=${status})}">下一页</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
