<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:if="${student.id == null}">新增学生</title>
    <title th:if="${student.id != null}">修改学生</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <style>
        body {
            background-image: url("/bg-library.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(44, 66, 87, 0.45);
            background-blend-mode: multiply;
            min-height: 100vh;
            padding: 40px 20px;
            margin: 0;
        }
        .card {
            max-width: 600px;
            margin: 0 auto;
            border-radius: 24px;
            background-color: #F8F3E6;
            overflow: hidden;
        }
        .card-header {
            background-color: #2C4257;
            color: #F8F3E6;
            padding: 1rem 1.5rem;
            font-size: 1.4rem;
            font-weight: 500;
        }
        .form-control, .form-select {
            background-color: #fff;
            border: 1px solid #D1C9B8;
            border-radius: 12px;
            padding: 10px 14px;
        }
        .form-label {
            color: #2C4257;
            font-weight: 500;
        }
        .btn-save {
            background-color: #2C4257;
            color: #F8F3E6;
            border-radius: 30px;
            padding: 8px 22px;
        }
        .btn-secondary {
            background-color: #b1624b;
            border-radius: 30px;
            color: #F8F3E6;
        }
        .error-msg {
            color: #b1624b;
            font-size: 0.8rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header" th:if="${student.id == null}">📝 新增学生</div>
    <div class="card-header" th:if="${student.id != null}">✏️ 修改学生</div>
    <div class="card-body p-4">
        <form id="studentForm" th:action="@{/student/save}" th:method="post" th:object="${student}">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">学号 *</label>
                <input type="text" class="form-control" th:field="*{studentId}" id="studentId" placeholder="请输入学号" required>
                <div class="error-msg" id="studentIdError"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">姓名 *</label>
                <input type="text" class="form-control" th:field="*{name}" id="name" placeholder="请输入姓名" required>
                <div class="error-msg" id="nameError"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">班级</label>
                <input type="text" class="form-control" th:field="*{className}" placeholder="请输入班级">
            </div>

            <div class="mb-3">
                <label class="form-label">性别</label>
                <select class="form-select" th:field="*{gender}">
                    <option value="">请选择</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">电话</label>
                <input type="tel" class="form-control" th:field="*{phone}" id="phone" placeholder="请输入联系电话">
                <div class="error-msg" id="phoneError"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-control" th:field="*{email}" id="email" placeholder="请输入邮箱">
                <div class="error-msg" id="emailError"></div>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <button type="submit" class="btn btn-save">💾 保存</button>
                <a th:href="@{/student/list}" class="btn btn-secondary">🔙 返回列表</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('studentForm').addEventListener('submit', function(e) {
        let isValid = true;

        const studentId = document.getElementById('studentId');
        const name = document.getElementById('name');
        const phone = document.getElementById('phone');
        const email = document.getElementById('email');

        document.querySelectorAll('.error-msg').forEach(el => el.innerText = '');

        if (!studentId.value.trim()) {
            document.getElementById('studentIdError').innerText = '学号不能为空';
            isValid = false;
        }
        if (!name.value.trim()) {
            document.getElementById('nameError').innerText = '姓名不能为空';
            isValid = false;
        }
        const phoneReg = /^1[3-9]\d{9}$/;
        if (phone.value && !phoneReg.test(phone.value)) {
            document.getElementById('phoneError').innerText = '请输入正确的手机号码';
            isValid = false;
        }
        const emailReg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email.value && !emailReg.test(email.value)) {
            document.getElementById('emailError').innerText = '请输入正确的邮箱格式';
            isValid = false;
        }

        if (!isValid) e.preventDefault();
    });
</script>
</body>
</html>
